# Nginx на хосте — единственная публичная точка входа.
#
# Схема:
#   aillix.ru          -> 127.0.0.1:8080 -> контейнерный Nginx -> web/backend
#   registry.aillix.ru -> 127.0.0.1:5000 -> registry (профиль tools)
#
# 1. Замените домен, если он другой.
# 2. Скопируйте в /etc/nginx/sites-available/aillix и создайте symlink.
# 3. Сертификаты:
#      certbot --nginx -d aillix.ru -d www.aillix.ru
#      certbot --nginx -d registry.aillix.ru

upstream aillix_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# --- HTTP: ACME + redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name aillix.ru www.aillix.ru registry.aillix.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- www -> apex -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aillix.ru;

    ssl_certificate /etc/letsencrypt/live/aillix.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aillix.ru/privkey.pem;

    return 301 https://aillix.ru$request_uri;
}

# --- Основной сайт -----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aillix.ru;

    ssl_certificate /etc/letsencrypt/live/aillix.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aillix.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;
    client_max_body_size 4m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Всё, включая /api и /admin, обслуживает контейнерный Nginx.
    location / {
        proxy_pass http://aillix_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://aillix_app;
        access_log off;
    }
}

# --- Локальный Docker Registry ----------------------------------------------
# TLS завершается здесь, сам registry слушает loopback:5000 без TLS.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name registry.aillix.ru;

    ssl_certificate /etc/letsencrypt/live/registry.aillix.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.aillix.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    # Образы бывают большими: не буферизуем тело запроса.
    client_max_body_size 0;
    chunked_transfer_encoding on;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
