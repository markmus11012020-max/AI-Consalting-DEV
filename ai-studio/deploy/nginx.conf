# Nginx для AI.STUDIO
# 1. Замените ai-studio.ru на ваш домен
# 2. Скопируйте в /etc/nginx/sites-available/ai-studio и создайте symlink в sites-enabled
# 3. Получите сертификат: certbot --nginx -d ai-studio.ru -d www.ai-studio.ru

upstream ai_studio_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai-studio.ru www.ai-studio.ru;

    # certbot добавит редирект на HTTPS автоматически
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ai-studio.ru www.ai-studio.ru;

    ssl_certificate /etc/letsencrypt/live/ai-studio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-studio.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /_next/static/ {
        proxy_pass http://ai_studio_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://ai_studio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/health {
        proxy_pass http://ai_studio_upstream;
        access_log off;
    }
}
