name: aillix

# =============================================================================
# Aillix — production stack
#
# Публичный вход: только Nginx. Все остальные сервисы доступны исключительно
# внутри Docker-сетей и не публикуют порты на хост.
#
#   Internet -> host Nginx (443, TLS) -> 127.0.0.1:8080 -> nginx (edge)
#                                                     -> web    (Next.js)
#                                                     -> backend (FastAPI)
#   backend -> postgres (data, internal)
#   pgAdmin / registry / watchtower -> профиль tools
#
# Поднять базовый контур:      docker compose up -d
# Поднять инструменты:         docker compose --profile tools up -d
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  nginx:
    <<: *default-restart
    image: nginx:1.27-alpine
    container_name: aillix-nginx
    depends_on:
      web:
        condition: service_healthy
    ports:
      # Наружу порт не публикуется: только loopback для host Nginx.
      - "127.0.0.1:${NGINX_PUBLISH_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.container.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  web:
    <<: *default-restart
    build:
      context: .
      dockerfile: Dockerfile
    image: aillix-web:${APP_VERSION:-latest}
    container_name: aillix-web
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Серверные запросы Next.js идут во внутреннюю сеть, а не через публичный URL.
      API_INTERNAL_URL: http://backend:8000
    networks:
      - edge
    volumes:
      - uploads_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  backend:
    <<: *default-restart
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aillix-backend:${APP_VERSION:-latest}
    container_name: aillix-backend
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  postgres:
    <<: *default-restart
    image: postgres:16-alpine
    container_name: aillix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Europe/Moscow
    # Порт наружу НЕ публикуется: база доступна только в сети data.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  # --- tools: только по требованию, в проде выключены -------------------------
  pgadmin:
    <<: *default-restart
    image: dpage/pgadmin4:8
    container_name: aillix-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # Только loopback: доступ через SSH-туннель.
      - "127.0.0.1:${PGADMIN_PUBLISH_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  registry:
    <<: *default-restart
    image: registry:2.8
    container_name: aillix-registry
    profiles: ["tools"]
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Aillix Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET}
    volumes:
      - registry_data:/var/lib/registry
      - ./deploy/registry:/auth:ro
    # TLS завершает host Nginx на registry.aillix.ru.
    ports:
      - "127.0.0.1:${REGISTRY_PUBLISH_PORT:-5000}:5000"
    networks:
      - registry
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  watchtower:
    <<: *default-restart
    image: containrrr/watchtower:1.7.1
    container_name: aillix-watchtower
    profiles: ["tools"]
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
      TZ: Europe/Moscow
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
  pgadmin_data:
  registry_data:
  uploads_data:
  nginx_cache:

networks:
  # Публичный край: nginx <-> web <-> backend.
  edge:
    driver: bridge
  # База данных: только backend/postgres/pgAdmin.
  data:
    driver: bridge
    internal: true
  # Локальный реестр образов.
  registry:
    driver: bridge
